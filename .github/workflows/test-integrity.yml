name: Trusted test integrity

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  test-integrity:
    name: test-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: UTC
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out trusted base only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use the pinned runtime from the trusted base
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Fetch PR objects without checking them out
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          askpass="$(mktemp)"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'SCRIPT'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          SCRIPT
          chmod 700 "$askpass"
          GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0 git -c credential.helper= -c core.hooksPath=/dev/null fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          [[ "$(git rev-parse FETCH_HEAD)" == "$HEAD_SHA" ]]
      - name: Inspect with trusted code; never install or execute PR dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          node scripts/run-test-integrity.ts 2>&1 | tee integrity-report.log
          status=${PIPESTATUS[0]}
          {
            echo '## Trusted test integrity'
            echo
            echo 'Open this current run output to review the exact findings and fingerprint.'
            echo
            echo '```text'
            cat integrity-report.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Preserve current test-integrity log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-integrity-log
          path: integrity-report.log
          if-no-files-found: error
          retention-days: 14
